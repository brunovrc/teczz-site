  <style>
    #tpre {
      position: fixed; inset: 0; z-index: 999999;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
      transition: opacity 0.55s ease;
    }
    #tpre.out { opacity: 0; pointer-events: none; }
    #tpre-logo {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #fff;
      line-height: 1;
      user-select: none;
    }
    #tpre-dot { color: #3b82f6; }
    #tpre-track {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    #tpre-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #3b82f6, #60a5fa);
      box-shadow: 0 0 8px rgba(96,165,250,0.6);
      animation: tpre-sweep 1.6s ease-in-out infinite;
    }
    @keyframes tpre-sweep {
      0%   { width: 0%;   margin-left: 0%; }
      50%  { width: 55%;  margin-left: 22%; }
      100% { width: 0%;   margin-left: 100%; }
    }
  </style>
  <div id="tpre">
    <div id="tpre-logo">Teczz<span id="tpre-dot">.</span></div>
    <div id="tpre-track"><div id="tpre-bar"></div></div>
  </div>
  <script>
    // Visita repetida: assets em cache, pula o preloader
    if (sessionStorage.getItem('tz')) {
      var p = document.getElementById('tpre');
      if (p) p.style.display = 'none';
    }
  </script>

  <body>
    <div id="root"></div>
